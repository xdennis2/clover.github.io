<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Cajas Baja Tensión · Visor CAD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d10;font-family:Arial,Helvetica,sans-serif}.app{height:100%;display:grid;grid-template-rows:50px 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#111419;color:#fff;border-bottom:1px solid #252a31}.name{font-size:14px;font-weight:700}.sub{font-size:10px;color:#9ca3af;margin-top:2px}.badge{font-size:10px;color:#cbd5e1;border:1px solid #39414d;border-radius:999px;padding:5px 8px}.frame{position:relative;min-height:0;background:#fff}.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}.loading{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:#0b0d10;color:#d1d5db;font-size:13px;z-index:3}.loading.hide{display:none}@media(max-width:520px){.app{grid-template-rows:44px 1fr}.badge{display:none}.name{font-size:13px}.sub{font-size:9px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><div class="name">Cajas Baja Tensión</div><div class="sub">20260728 · solo visualización</div></div><div class="badge">DWG + XREF</div></header>
<section class="frame">
<div class="loading" id="loading">Cargando plano completo…</div>
<iframe id="cadframe" title="Cajas Baja Tensión" scrolling="no" allowfullscreen></iframe>
</section>
</main>
<script>
const zipUrl=new URL('./Cajas-Baja-Tension-WEB.zip',location.href).href;
const viewer='https://iframe.sharecad.org/cadframe/load?url='+encodeURIComponent(zipUrl);
const f=document.getElementById('cadframe');
const l=document.getElementById('loading');
f.src=viewer;
f.addEventListener('load',()=>setTimeout(()=>l.classList.add('hide'),1200));
setTimeout(()=>l.classList.add('hide'),15000);
</script>
</body>
</html>
