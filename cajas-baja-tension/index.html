<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>Cajas Baja Tensión · Visor CAD</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0b0d10;font-family:Arial,Helvetica,sans-serif;overflow:hidden}.app{height:100%;display:grid;grid-template-rows:52px 1fr;background:#0b0d10}.bar{display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #2a2f37;background:#111419;color:#fff}.title{min-width:0}.name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:10px;color:#9ca3af;margin-top:2px}.tag{font-size:10px;border:1px solid #39414d;border-radius:999px;padding:5px 8px;color:#cbd5e1}.frame{position:relative;min-height:0;background:#05070a}.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#0b0d10;color:#d1d5db;font-size:13px;z-index:2;pointer-events:none}.loading.hide{display:none}@media(max-width:520px){.app{grid-template-rows:46px 1fr}.tag{display:none}.name{font-size:13px}.sub{font-size:9px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="bar">
      <div class="title">
        <div class="name">Cajas Baja Tensión</div>
        <div class="sub">20260728 · solo visualización</div>
      </div>
      <div class="tag">DWG</div>
    </header>
    <section class="frame">
      <div class="loading" id="loading">Cargando plano…</div>
      <iframe
        id="cadframe"
        title="Visor CAD Cajas Baja Tensión"
        src="https://iframe.sharecad.org/cadframe/load?url=https%3A%2F%2Fraw.githubusercontent.com%2Fxdennis2%2Fclover.github.io%2Fmain%2Fcajas-baja-tension%2FCajas-Baja-Tension-WEB.zip"
        scrolling="no"
        allowfullscreen>
      </iframe>
    </section>
  </main>
  <script>
    const f=document.getElementById('cadframe');
    const l=document.getElementById('loading');
    f.addEventListener('load',()=>setTimeout(()=>l.classList.add('hide'),700));
    setTimeout(()=>l.classList.add('hide'),12000);
  </script>
</body>
</html>
