<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Cajas Baja Tensión · Visor CAD</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d10;font-family:Arial,Helvetica,sans-serif}
.viewer{position:fixed;inset:0;background:#fff}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:#0b0d10;color:#e5e7eb;text-align:center;padding:24px;font-size:14px;z-index:10}
.loading.hide{display:none}
.label{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;z-index:20;background:rgba(11,13,16,.88);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 10px;backdrop-filter:blur(8px);pointer-events:none}
.label strong{display:block;font-size:13px}.label span{display:block;margin-top:2px;font-size:9px;color:#aeb6c2}
.full{position:fixed;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:20;border:1px solid rgba(255,255,255,.25);background:rgba(11,13,16,.88);color:#fff;border-radius:10px;padding:10px 13px;font-size:12px;font-weight:700}
@media(max-width:600px){.label{padding:7px 9px}.full{padding:9px 11px;font-size:11px}}
</style>
</head>
<body>
<div class="viewer" id="viewer">
  <div class="loading" id="loading">Cargando DWG principal y referencias…</div>
  <iframe id="cadframe" title="Cajas Baja Tensión" scrolling="no" allowfullscreen></iframe>
</div>
<div class="label"><strong>Cajas Baja Tensión</strong><span>DWG principal + XREF · solo visualización</span></div>
<button class="full" id="full">PANTALLA COMPLETA</button>
<script>
const archiveUrl=new URL('./Cajas-Baja-Tension-XREF.zip',location.href).href;
const sharecad='https://iframe.sharecad.org/cadframe/load?url='+encodeURIComponent(archiveUrl);
const frame=document.getElementById('cadframe');
const loading=document.getElementById('loading');
const viewer=document.getElementById('viewer');
frame.src=sharecad;
frame.addEventListener('load',()=>setTimeout(()=>loading.classList.add('hide'),1400));
setTimeout(()=>loading.classList.add('hide'),20000);
document.getElementById('full').addEventListener('click',async()=>{
  try{await viewer.requestFullscreen?.();}catch(e){}
  try{await screen.orientation?.lock?.('landscape');}catch(e){}
});
</script>
</body>
</html>
