name: Extract Cadview WASM

on:
  push:
    paths:
      - '.github/workflows/extract-cadview-wasm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract libredwg.wasm from npm package
        run: |
          set -euxo pipefail
          mkdir -p /tmp/cadview-wasm cajas-baja-tension
          cd /tmp/cadview-wasm
          npm pack @cadview/dwg@0.2.0
          tar -xzf cadview-dwg-0.2.0.tgz
          test -s package/dist/libredwg.wasm
          cp package/dist/libredwg.wasm "$GITHUB_WORKSPACE/cajas-baja-tension/libredwg.wasm"
          ls -lh "$GITHUB_WORKSPACE/cajas-baja-tension/libredwg.wasm"

      - name: Commit WASM
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'cajas-baja-tension/libredwg.wasm'
          git diff --cached --quiet && exit 0
          git commit -m 'Add self-hosted cadview WASM'
          git push
